appId: dev.pupitre.app
# One word, no space and no accent, and this is not a style choice: Chromium
# registers a Mach service named after CFBundleName, and a Mach service name
# accepts neither. A name containing one traps the app at startup on an
# EXC_BREAKPOINT, without a word on the output or in the logs. Staying on one
# word means the bundle, the Dock, the Finder and the menu bar all carry the same
# name, with no fallback name.
productName: Pupitre
copyright: Copyright © 2026 Jordan Monier

directories:
  buildResources: build
  output: dist

# `pupitre://server/<id>`, `pupitre://project/<serverId>/<name>` and the
# account callback open the app, or bring it to the front. The main process
# checks what a link names before the window hears of it.
protocols:
  - name: Pupitre
    schemes:
      - pupitre

# What goes into the archive is named, not what stays out: the bundles and the
# manifest. electron-builder adds the production dependencies on its own —
# only what the main process loads at runtime, everything else is bundled.
files:
  - out/**
  - package.json

# The probe is sent to the server on standard input: it has to stay a readable
# file outside the asar archive.
# The agent is not shipped with the app: an enrolled server names its release,
# the app downloads that binary from the platform, checks its signature and
# pushes it. Only a development build falls back to the one it built locally.
extraResources:
  - from: resources/probe.sh
    to: probe.sh

# node-pty ships a native binary, and a .node cannot be loaded from an asar
# archive. Without this the app starts and no terminal ever opens.
asarUnpack:
  - "**/node_modules/node-pty/**"

# The archive carries the hashes of what it contains, and the binary refuses to
# run anything else: swapping a file in an installed app breaks the signature
# instead of running. The fuses are flipped just before signing, so the app is
# signed as it will run.
electronFuses:
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true

# The artefacts are public: they live in the download bucket, one folder per
# version, and one folder per channel holds the feed electron-updater reads.
# This is the feed a build ships with; the app points itself at the folder of
# the channel it follows when it starts. Nothing here is a secret, and no token
# is baked into the app.
publish:
  provider: generic
  url: https://dl.pupitre.studio/app/stable
  channel: latest

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # The architecture is in the name of every artefact, on the three systems: the
  # publication reads it from there, and a download page that cannot say which
  # machine a file is for is worse than no page.
  artifactName: Pupitre-${version}-${arch}.${ext}
  # Both architectures: an Intel Mac is still a Mac, and cross-building the other
  # one costs nothing here. The dmg is what a person installs; the zip is what
  # electron-updater downloads, it never updates from a dmg.
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  # Signing and notarization are driven entirely by the environment: with no
  # identity in the keychain, electron-builder says so and builds an unsigned
  # bundle, which is what a developer building on their own machine wants.
  # Entitlements are electron-builder's own defaults — JIT, unsigned executable
  # memory and library validation off, exactly what Chromium and node-pty need.
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true

dmg:
  title: Pupitre
  contents:
    - x: 140
      y: 190
      type: file
    - x: 400
      y: 190
      type: link
      path: /Applications

linux:
  category: Development
  icon: build/icon.png
  # Without this the binary is named after the package — "@pupitredesktop" —
  # which AppImage refuses outright, and which no desktop entry can point at.
  executableName: pupitre
  synopsis: Pilote un serveur de développement distant
  description: >-
    Pupitre installe un serveur de développement sur une machine nue, puis en
    montre les projets, les services, les journaux et les terminaux.
  # Required by dpkg, and electron-builder refuses to build a .deb without it.
  maintainer: Jordan Monier <no-reply@pupitre.studio>
  target:
    - AppImage
    - deb
  artifactName: Pupitre-${version}-${arch}.${ext}
  # The window carries no title bar of its own; a desktop environment ties it
  # back to its launcher entry by WM_CLASS, which Electron takes from
  # `desktopName` in package.json. This makes the installed file agree with it.
  syncDesktopName: true

deb:
  # Both default to the workspace name, "@pupitre/desktop", whose slash turns the
  # artefact into a folder that does not exist and stops the build.
  packageName: pupitre
  artifactName: pupitre_${version}_${arch}.${ext}

win:
  # No .ico in the repository: electron-builder derives one from build/icon.png.
  icon: build/icon.png
  target:
    - nsis
  # Signing is Azure Trusted Signing, whose names are read in the portal. They
  # are not in this file: the release workflow passes them on the command line
  # from repository variables, the publisher among them, which app-update.yml
  # carries so an installed app refuses an installer signed by anyone else. A
  # stable build without them stops; a beta or local one is unsigned and says
  # so. See the runbook in docs/monorepo.md.

nsis:
  artifactName: Pupitre-Setup-${version}-${arch}.${ext}
