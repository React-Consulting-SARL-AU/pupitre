appId: dev.pupitre.app
# One word, no space and no accent, and this is not a style choice: Chromium
# registers a Mach service named after CFBundleName, and a Mach service name
# accepts neither. A name containing one traps the app at startup on an
# EXC_BREAKPOINT, without a word on the output or in the logs. Staying on one
# word means the bundle, the Dock, the Finder and the menu bar all carry the same
# name, with no fallback name.
productName: Pupitre
copyright: Copyright © 2026 Jordan Monier

directories:
  buildResources: build
  output: dist

files:
  - "!src/**"
  - "!electron.vite.config.{js,ts,mjs,cjs,d.ts}"
  - "!{.gitignore,bun.lock,package-lock.json,pnpm-lock.yaml,biome.jsonc}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
  - "!**/*.tsbuildinfo"
  - "!README.md"
  - "!scripts/**"
  - "!resources/**"

# The probe is sent to the server on standard input: it has to stay a readable
# file outside the asar archive.
extraResources:
  - from: resources/probe.sh
    to: probe.sh
  # The agent is pushed onto the server over the channel: it has to stay a real
  # file, executable and outside the asar archive.
  - from: resources/agent
    to: agent
    filter:
      - "pupitred-linux-*"
      - manifest.json

# node-pty ships a native binary, and a .node cannot be loaded from an asar
# archive. Without this the app starts and no terminal ever opens.
asarUnpack:
  - "**/node_modules/node-pty/**"

# The archive carries the hashes of what it contains, and the binary refuses to
# run anything else: swapping a file in an installed app breaks the signature
# instead of running. The fuses are flipped just before signing, so the app is
# signed as it will run.
electronFuses:
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true

# The releases are private, and the app reads them with a token the workflow
# bakes in. Nothing here is a secret: `owner` and `repo` name a repository that
# answers nothing without one.
publish:
  provider: github
  owner: jordanmonier
  repo: pupitre
  private: true
  releaseType: release

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # Both architectures: an Intel Mac is still a Mac, and cross-building the other
  # one costs nothing here.
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  # Signing and notarization are driven entirely by the environment: with no
  # identity in the keychain, electron-builder says so and builds an unsigned
  # bundle, which is what a developer building on their own machine wants.
  # Entitlements are electron-builder's own defaults — JIT, unsigned executable
  # memory and library validation off, exactly what Chromium and node-pty need.
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true

dmg:
  title: Pupitre
  contents:
    - x: 140
      y: 190
      type: file
    - x: 400
      y: 190
      type: link
      path: /Applications

linux:
  category: Development
  icon: build/icon.png
  # Without this the binary is named after the package — "@pupitredesktop" —
  # which AppImage refuses outright, and which no desktop entry can point at.
  executableName: pupitre
  synopsis: Pilote un serveur de développement distant
  description: >-
    Pupitre installe un serveur de développement sur une machine nue, puis en
    montre les projets, les services, les journaux et les terminaux.
  # Required by dpkg, and electron-builder refuses to build a .deb without it.
  maintainer: Jordan Monier <no-reply@pupitre.studio>
  target:
    - AppImage
    - deb
  # The window carries no title bar of its own; a desktop environment ties it
  # back to its launcher entry by WM_CLASS, which Electron takes from
  # `desktopName` in package.json. This makes the installed file agree with it.
  syncDesktopName: true

deb:
  # Both default to the workspace name, "@pupitre/desktop", whose slash turns the
  # artefact into a folder that does not exist and stops the build.
  packageName: pupitre
  artifactName: pupitre_${version}_${arch}.${ext}

win:
  # No .ico in the repository: electron-builder derives one from build/icon.png.
  icon: build/icon.png
  target:
    - nsis
  # Signing is Azure Trusted Signing, whose four names are read in the portal:
  # `azureSignOptions` is added here once they exist, and the credentials come
  # from the environment. See the runbook in docs/monorepo.md.
