# A machine that opens with nothing: no key to declare, no password to type.
#
# root has an empty password and sshd is told to accept one, so the `none`
# method succeeds and the session opens on the first try. That is what the app's
# first connection wants — it installs its own per-server key over that session,
# as it would on a machine bought from a host, and never asks the reader for
# anything.
#
# Read after 10-pupitre.conf, which core.hardening writes: sshd keeps the first
# value it obtains, so once the machine is hardened these three lines lose, root
# closes and nothing opens without a key. That is the point of the rig.
PermitRootLogin yes
PasswordAuthentication yes
PermitEmptyPasswords yes

# The host keys live on a volume so the machine keeps its identity across a
# rebuild. Without this the app would refuse every rebuilt container, having
# pinned the fingerprint of the one before.
HostKey /etc/ssh/hostkeys/ssh_host_ed25519_key
HostKey /etc/ssh/hostkeys/ssh_host_rsa_key
