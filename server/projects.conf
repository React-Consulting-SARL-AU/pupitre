# =============================================================================
#  projects.conf — THE stack's source of truth.
#
#  Drives cloning, dependency installation, tmux sessions and — when the machine
#  has a tunnel — its routes and DNS records. Without a tunnel, the "subdomain"
#  column is simply ignored: each project is reached on its port.
#
#      dev up <name>                            start
#      ./deploy.sh tunnel,projects              after a change
#
#  This file is the repository's. The machine reads a second one,
#  /etc/dev-stack.projects.local.conf, which deployment never touches: that is
#  where projects added from Pupitre or by `dev project add` land. On equal
#  names, the local file wins.
#
#  Columns, separated by "|" (no space around the separator):
#
#   1 name     short, unique identifier.
#   2 dir      path relative to $PROJECTS_DIR. The first segment is the
#              repository folder; the following segments point at a sub-project.
#   3 repo     git URL, or "-" if an earlier row already clones that repository.
#   4 pkgmgr   bun | pnpm | npm | gradle | service | none
#   5 host     what the dev server announces. **127.0.0.1 by default**, and that
#              is the convention: a unique port per service is enough to keep
#              them apart. If one of your repositories freezes a hostname in its
#              package.json, put that hostname here — bootstrap.sh points every
#              *.localhost host found in this column at 127.0.0.1 in /etc/hosts.
#   6 port     listening port — UNIQUE.
#              The convention is http: no project serves TLS locally, and it is
#              better kept that way. If one does anyway, the stack detects it
#              when writing the ingress; "https:5180" is still accepted to force
#              the matter when the service is stopped at generation time.
#   7 sub      subdomain under $DEV_DOMAIN, at ONE single level (that is what a
#              free wildcard certificate covers), or "-" not to publish it.
#   8 cmd      start command, run from `dir`.
#   9 install  OPTIONAL. The command that installs the dependencies, run from
#              `dir` by `dev sync` and `dev install`. Left out — or "-" — it is
#              derived from `pkgmgr`:
#                  bun → bun install       pnpm → pnpm install
#                  npm → npm install       yarn → yarn install
#                  gradle → ./gradlew --version   (downloads the distribution)
#              Whatever it ends up being, `dev install` prints it before running
#              it and `dev projects` returns it: how a project's dependencies
#              were installed should never be a guess. Fill it in for anything
#              the list above does not cover — a Python venv, a Composer
#              project, a Makefile, a monorepo that needs a filtered install.
#
#  ── CHOOSING A PORT ─────────────────────────────────────────────────────────
#  Ports are checked by `bootstrap.sh --check`: two projects on the same port are
#  reported before any installation.
#
#  Beware of a client's /api proxy: many single-page apps hard-code their proxy
#  target in vite.config.ts. The API's port is then not free — it is dictated by
#  the client. Getting it wrong breaks nothing visibly: the page loads, then every
#  call answers 502. Read the client's config before choosing its API's port.
#
#  ── PINNING THE PORT ON THE COMMAND LINE ────────────────────────────────────
#  Rather than editing your repositories, pass the options AFTER the project's
#  own command: Vite and Astro keep the last occurrence of each option, so the
#  repository's script (preparation, wrappers) is preserved in full.
#
#      Vite, Astro         --host 127.0.0.1 --port N   at the END
#      Next.js             next dev -H 127.0.0.1 -p N
#      Nuxt                NUXT_HOST=127.0.0.1 NUXT_PORT=N
#      Remix, SvelteKit    --host 127.0.0.1 --port N
#      Spring Boot, Grails SERVER_PORT=N   IN FRONT of the command
#      Rails               bin/rails s -b 127.0.0.1 -p N
#      Django              python manage.py runserver 127.0.0.1:N
# =============================================================================

# name|dir|repo|pkgmgr|host|port|sub|cmd            (install derived)
# name|dir|repo|pkgmgr|host|port|sub|cmd|install    (install spelled out)

# --- Examples ----------------------------------------------------------------
# Uncomment, adapt, then:  ./deploy.sh tunnel,projects
#
# A plain single-project app:
# my-site|my-site|https://github.com/me/my-site|bun|127.0.0.1|3000|my-site|bun run dev --host 127.0.0.1 --port 3000
#
# A monorepo with two processes. The first row carries the repository URL; the
# next ones carry "-", since the clone is already done. They are grouped by the
# first segment of their folder — that is the `group` field of
# `dev status --json`, there is no column to fill in for it.
# shop|shop/apps/web|https://github.com/me/shop|bun|127.0.0.1|3100|shop-web|bun run dev --port 3100
# shop-mail|shop|-|none|127.0.0.1|3101|shop-mail|bun --cwd=apps/mail run dev -- --port 3101
#
# A JVM back end and its front end, in the same repository. SERVER_PORT is read
# by Spring Boot before application.yml, so the repository stays untouched.
# api|api-server/server|https://github.com/me/api-server|gradle|127.0.0.1|8080|api|SERVER_PORT=8080 ./gradlew bootRun --console=plain
# api-web|api-server/client|-|pnpm|127.0.0.1|5180|api-web|pnpm run dev --host 127.0.0.1 --port 5180
#
# A folder with no repository: leave column 3 at "-" and the folder is simply
# created.
# scratch|scratch|-|none|127.0.0.1|4000|-|bun run dev --port 4000
#
# Anything the derived commands do not cover: spell the install out in column 9.
# api-py|api-py|https://github.com/me/api-py|none|127.0.0.1|8000|api-py|.venv/bin/uvicorn app:app --port 8000|python3 -m venv .venv && .venv/bin/pip install -r requirements.txt
# site-php|site-php|https://github.com/me/site-php|none|127.0.0.1|8001|site-php|php -S 127.0.0.1:8001 -t public|composer install --no-interaction
# tool-go|tool-go|https://github.com/me/tool-go|none|127.0.0.1|8002|-|go run ./cmd/server|go mod download

# --- Screenshot gallery ------------------------------------------------------
# A systemd service, not a project: serves ~/shots so that images produced by
# agents are visible from your own machine. Installed by bootstrap.sh; keep this
# row unless you do not want the gallery.
shots|.|-|service|127.0.0.1|8099|shots|-|-
