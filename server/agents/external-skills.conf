# Third-party skills, installed by `npx skills add <repo> -g` for every agent.
#
# One source per line: the GitHub repository, then, optionally, the only skills
# to keep (names separated by commas). Without that list, the whole repository.
#
#     bootstrap.sh --only=skills        (re)plays the installation
#     npx skills update                 updates them, on the server
#
# They land in ~/.agents/skills, which Codex reads directly, and are symlinked
# into ~/.claude/skills for Claude Code.

# Interface design: critique, polish, typography, colour, motion.
pbakaus/impeccable

# SEO: audits, schema, Core Web Vitals, GEO. Claude Code additionally receives
# the full plugin (agents, hooks, Python runtime) — see phase_skills.
AgriciDaniel/claude-seo

# Anthropic: polished frontend interfaces, and the skill-authoring workshop.
anthropics/skills frontend-design,skill-creator

# Vercel: web interface guidelines and React best practices.
vercel-labs/agent-skills web-design-guidelines,vercel-react-best-practices,vercel-composition-patterns
