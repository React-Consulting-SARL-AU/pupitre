# =============================================================================
#  ghostty.conf — Ghostty settings for remote work on the server.
#
#  Installed by setup-mac.sh as ~/.config/ghostty/dev-stack.conf, then included
#  from your main configuration by a single line:
#
#      config-file = dev-stack.conf
#
#  Nothing is overwritten: your existing config stays the source, this one only
#  adds what the remote setup needs. Remove the include line to undo everything.
#
#  The full list of options can be read with:  ghostty +show-config --default --docs
# =============================================================================

# --- The setting that really matters ------------------------------------------
# Ghostty announces TERM=xterm-ghostty. That is the right choice locally, but a
# remote server without that terminfo entry cannot draw: the `dev tui` dashboard
# renders crooked, tmux loses its colours.
#
# Two solutions, and setup-mac.sh applies the first:
#   1. install the terminfo on the server (done once and for all);
#   2. uncomment the line below to announce a universal TERM.
#
# Keep solution 1: it preserves Ghostty's real capabilities.
# term = xterm-256color

# --- tmux comfort -------------------------------------------------------------
# Without this, Alt+arrows and the Meta shortcuts of zsh/tmux do not get through.
macos-option-as-alt = true

# tmux keeps its own scrollback on the server; 10,000 lines locally is plenty and
# keeps memory low.
scrollback-limit = 10000

# Shell integration gives Ghostty the current directory and the command markers.
# It has no effect inside tmux — that is expected, tmux gets in the way — but it
# is useful on your local shells.
shell-integration = zsh
shell-integration-features = cursor,sudo,title

# --- Window -------------------------------------------------------------------
window-padding-x = 10
window-padding-y = 8
window-padding-balance = true
mouse-hide-while-typing = true
copy-on-select = clipboard

# A remote tmux session must not be closed by accident.
confirm-close-surface = true

# --- Quick terminal -----------------------------------------------------------
# A panel dropping down over everything, handy for `tui` or `dev status`.
# The global shortcut is left commented out: key names vary between Ghostty
# versions and one invalid line makes the WHOLE config fail. Check the exact name
# your version accepts first:
#     ghostty +list-actions | grep quick_terminal
#     ghostty +list-keybinds          # the syntax of the existing shortcuts
# then uncomment whichever of the two works:
# keybind = global:cmd+backquote=toggle_quick_terminal
# keybind = global:cmd+grave=toggle_quick_terminal
quick-terminal-position = top

# --- Splits -------------------------------------------------------------------
# For LOCAL shells. Everything running on the server goes into tmux windows: they
# survive disconnection, splits do not. Cmd+D and Cmd+Shift+D are already
# Ghostty's defaults on macOS, so we do not redefine them here — no line that
# could fail.

# --- Appearance ---------------------------------------------------------------
# Ghostty ships the iTerm2 themes: `ghostty +list-themes` to pick one.
# theme = catppuccin-mocha
# font-family = "JetBrainsMono Nerd Font"
# font-size = 13
