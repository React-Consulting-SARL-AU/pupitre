name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  desktop:
    name: App ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    env:
      # Read by electron-updater in the built app: the releases are private and
      # the GitHub API answers nothing without it.
      MAIN_VITE_UPDATE_TOKEN: ${{ secrets.PUPITRE_UPDATE_TOKEN }}
      # Read by electron-builder to publish, and by nothing that ships.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: apps/agent/go.mod

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Bun skips that install script often enough that the binary is missing on
      # a fresh checkout, and electron-vite compiles the bytecode with it.
      - name: Install the Electron binary
        run: node node_modules/electron/install.js
        working-directory: apps/desktop

      # The app carries the agent it pushes onto a bare server; without this the
      # build only warns, and ships an app that cannot install anything.
      - name: Build the agent
        run: bun --cwd=apps/agent run build

      - name: Prepare the notarization key
        if: runner.os == 'macOS'
        run: |
          umask 077
          printf '%s' "$APPLE_API_KEY_CONTENT" | base64 --decode > "$RUNNER_TEMP/apple-api-key.p8"
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}

      - name: Build, sign and publish
        run: bun --cwd=apps/desktop run release
        env:
          # macOS: Developer ID certificate, then notarization by App Store
          # Connect key. Absent, electron-builder builds unsigned and says so.
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Windows: Azure Trusted Signing, which authenticates as an Entra ID
          # application rather than holding a certificate file.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Forget the notarization key
        if: always() && runner.os == 'macOS'
        run: rm -f "$RUNNER_TEMP/apple-api-key.p8"
