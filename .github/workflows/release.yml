name: Release

# One tag, one version. The owner's Mac wrote the version and the notes and
# pushed the tag — `scripts/release.sh`; from here every step is a command of
# `scripts/release`, run the same way on these runners or on a machine of ours.
# This file installs the tools, names the step and hands it its secrets; the
# buckets are the only thing the jobs share, and every step is idempotent, so
# a failed job is re-run alone and the release resumes where it stood.
#
# The tag sits on `staging`. `ci.yml` checks the tagged commit first, and
# nothing is signed, published or declared unless it passes. The version is
# then built, declared to the platform and checked from outside; `staging` is
# merged into `main` last, which is what deploys the site and the console.
# `promote.yml` is the way back.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version semver à publier, sans le v (défaut, celle du manifeste)
        required: false
      channel:
        description: Canal de publication
        type: choice
        options: [stable, beta]
        default: stable

# Two runs of one version would race for the same objects: they queue.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TURBO_TELEMETRY_DISABLED: "1"
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  # `merge` in `scripts/release` waits for this job's check run by name.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  agent:
    name: Agent
    needs: ci
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    outputs:
      release: ${{ steps.resolve.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: apps/agent/go.mod

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The addresses and the bucket names come from the template the owner's
      # Mac uses; the secrets are the same template's references, set once by
      # `release secrets`.
      - name: Read the release settings
        run: grep -Ev '^\s*(#|$)|op://' scripts/release/release.env.tpl >> "$GITHUB_ENV"

      # The version and the channel, from git and the manifest; the other jobs
      # read them from this job rather than resolving twice.
      - name: Resolve the release
        id: resolve
        run: |
          args=()
          if [ -n "${VERSION:-}" ]; then args+=("--version=$VERSION"); fi
          if [ -n "${CHANNEL:-}" ]; then args+=("--channel=$CHANNEL"); fi
          bun scripts/release/index.ts resolve "${args[@]}" | tee -a "$GITHUB_ENV"
          echo "release=$(bun scripts/release/index.ts resolve "${args[@]}" --format=json)" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}

      - name: Check the changelog and the app version
        run: bun scripts/release/index.ts check

      # A version the bucket already holds is taken from there, not rebuilt:
      # garble does not reproduce a binary, and the platform keeps the digests.
      # This runner tries the amd64 binary; the arm64 one is tried on its own
      # machine below, never under emulation.
      - name: Build, sign and smoke the agent
        run: bun scripts/release/index.ts agent build
        env:
          PUPITRE_RELEASE_PRIVATE_KEY: ${{ secrets.PUPITRE_RELEASE_PRIVATE_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-${{ fromJSON(steps.resolve.outputs.release).version }}
          path: apps/agent/dist/release
          retention-days: 1
          if-no-files-found: error

  agent-arm64:
    name: Agent on arm64
    needs: agent
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    timeout-minutes: 15
    env:
      PUPITRE_RELEASE_VERSION: ${{ fromJSON(needs.agent.outputs.release).version }}
      PUPITRE_RELEASE_CHANNEL: ${{ fromJSON(needs.agent.outputs.release).channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: apps/agent/go.mod

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read the release settings
        run: grep -Ev '^\s*(#|$)|op://' scripts/release/release.env.tpl >> "$GITHUB_ENV"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-${{ fromJSON(needs.agent.outputs.release).version }}
          path: apps/agent/dist/release

      # The binary this machine can run, run: version and hello, natively.
      - name: Smoke the arm64 agent
        run: bun scripts/release/index.ts agent smoke
        env:
          PUPITRE_RELEASE_PRIVATE_KEY: ${{ secrets.PUPITRE_RELEASE_PRIVATE_KEY }}

      # Both binaries tried on their own machine: the private bucket, then the
      # platform.
      - name: Publish the agent
        run: bun scripts/release/index.ts agent publish
        env:
          PUPITRE_PUBLISH_TOKEN: ${{ secrets.PUPITRE_PUBLISH_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

  desktop:
    name: App ${{ matrix.system }}
    needs: [agent, agent-arm64]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      # One system failing does not stop the others: it is re-run alone.
      fail-fast: false
      matrix:
        include:
          - system: macOS
            runner: blacksmith-6vcpu-macos-15
          - system: Windows
            runner: blacksmith-4vcpu-windows-2025
          - system: Linux
            runner: blacksmith-4vcpu-ubuntu-2404
    env:
      PUPITRE_RELEASE_VERSION: ${{ fromJSON(needs.agent.outputs.release).version }}
      PUPITRE_RELEASE_CHANNEL: ${{ fromJSON(needs.agent.outputs.release).channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Electron and electron-builder's tools are downloaded once per version
      # of each, not once per release.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: electron-${{ runner.os }}-${{ hashFiles('apps/desktop/package.json') }}

      # node-pty links against the Spectre-mitigated MSVC libraries, which the
      # Blacksmith Windows image does not always carry; the installer it has
      # adds them, on whichever Visual Studio the image ships — the edition and
      # its path change with the image, so vswhere names it. The step only
      # prepares the ground: what it could not do is printed with the
      # installer's own log, and the build of node-pty right after is the
      # judge, with an error that names what is missing.
      - name: Install the Spectre-mitigated MSVC libraries
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $root = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vswhere = Join-Path $root "vswhere.exe"
          $installer = Join-Path $root "vs_installer.exe"

          if (-not (Test-Path $vswhere) -or -not (Test-Path $installer)) {
            Write-Host "no Visual Studio installer on this image: $root"
            exit 0
          }

          $path = & $vswhere -products * -latest -prerelease -property installationPath | Select-Object -First 1
          if (-not $path) {
            Write-Host "vswhere found no Visual Studio instance"
            exit 0
          }
          Write-Host "Visual Studio at $path"

          $since = Get-Date
          $arguments = @("modify", "--installPath", "`"$path`"", "--add", "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart", "--nocache")
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru

          if ($process.ExitCode -eq 0 -or $process.ExitCode -eq 3010) { exit 0 }

          Write-Host "the installer answered $($process.ExitCode); its log follows"
          Get-ChildItem $env:TEMP -Filter "dd_*.log" |
            Where-Object { $_.LastWriteTime -ge $since } |
            ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName -Tail 40 }

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read the release settings
        run: grep -Ev '^\s*(#|$)|op://' scripts/release/release.env.tpl >> "$GITHUB_ENV"

      # The step reads the agent from the bucket, builds the app of this
      # system, signs it where the system asks for it — a stable build stops
      # when a signing value is missing — and leaves the result in the bucket
      # for the publish job.
      - name: Build the app
        run: bun scripts/release/index.ts desktop
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # Remove once Azure Trusted Signing is configured.
          PUPITRE_ALLOW_UNSIGNED_WINDOWS: "1"

  publish:
    name: Publish the app
    needs: [agent, desktop]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      PUPITRE_RELEASE_VERSION: ${{ fromJSON(needs.agent.outputs.release).version }}
      PUPITRE_RELEASE_CHANNEL: ${{ fromJSON(needs.agent.outputs.release).channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read the release settings
        run: grep -Ev '^\s*(#|$)|op://' scripts/release/release.env.tpl >> "$GITHUB_ENV"

      # Every installer the three systems left: signed with the release key,
      # put in the public bucket, declared to the platform.
      - name: Sign, upload and declare
        run: bun scripts/release/index.ts app publish
        env:
          PUPITRE_RELEASE_PRIVATE_KEY: ${{ secrets.PUPITRE_RELEASE_PRIVATE_KEY }}
          PUPITRE_PUBLISH_TOKEN: ${{ secrets.PUPITRE_PUBLISH_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      # The release is done when what a customer downloads is there: the
      # platform describes the version, the bucket serves every file whole
      # and the feeds point at it. The report is the run's summary.
      - name: Verify what a customer downloads
        run: bun scripts/release/index.ts verify | tee -a "$GITHUB_STEP_SUMMARY"

  merge:
    name: Merge into main
    needs: [ci, agent, publish]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      checks: read
      contents: write
      pull-requests: write
    env:
      PUPITRE_RELEASE_VERSION: ${{ fromJSON(needs.agent.outputs.release).version }}
      PUPITRE_RELEASE_CHANNEL: ${{ fromJSON(needs.agent.outputs.release).channel }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read the release settings
        run: grep -Ev '^\s*(#|$)|op://' scripts/release/release.env.tpl >> "$GITHUB_ENV"

      # Everything the version names is downloadable: `staging` goes into
      # `main` by a pull request, merged with a merge commit so the tagged
      # commit stays in its history, and only when its head is the tagged
      # commit and the CI check run on it passed. The push of `main` is what
      # deploys the site and the console; made with this token, it runs no
      # other workflow.
      - name: Open the pull request and merge it
        run: bun scripts/release/index.ts merge
