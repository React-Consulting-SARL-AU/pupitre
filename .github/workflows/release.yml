name: Release

# Un tag, une version : l'agent d'abord — il faut qu'il soit publié avant que
# l'app puisse le proposer — puis l'app sur les trois systèmes, puis la mise en
# ligne. Le tag est posé sur `staging` ; une version sort donc en `beta`, et le
# merge de la pull request `staging` → `main` la passe en `stable` par
# `promote.yml`, sans rien reconstruire.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version semver à publier, sans le v
        required: true
      channel:
        description: Canal de publication
        type: choice
        options: [beta, stable]
        default: beta

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  agent:
    name: Agent
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The signing key and the platform token live in this environment: the owner
    # gates the run, nothing here reads a secret's value.
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      platform: ${{ steps.branch.outputs.platform }}
    env:
      PUPITRE_RELEASE_CHANNEL: ${{ inputs.channel || 'beta' }}
      R2_BUCKET: ${{ vars.PUPITRE_R2_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # The tag carries the v, the platform stores plain semver.
      - name: Resolve the published version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${REQUESTED:-${GITHUB_REF_NAME#v}}"
          echo "PUPITRE_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=${PUPITRE_RELEASE_CHANNEL}" >> "$GITHUB_OUTPUT"

      # A tag posed on a branch nobody merges would publish code that never
      # reaches production, under a version number that can never be promoted.
      # The branch also names the platform the version is declared to: `main`
      # speaks to production, anything else on `staging` speaks to staging, and
      # `promote.yml` carries the version to production when `main` takes it.
      - name: Resolve the branch and its platform
        id: branch
        env:
          STAGING_PLATFORM_URL: ${{ vars.PUPITRE_STAGING_PLATFORM_URL }}
          PRODUCTION_PLATFORM_URL: ${{ vars.PUPITRE_PLATFORM_URL }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin \
            "+refs/heads/staging:refs/remotes/origin/staging" \
            "+refs/heads/main:refs/remotes/origin/main" || true
          platform=""
          if git rev-parse --verify --quiet origin/main >/dev/null &&
            git merge-base --is-ancestor HEAD origin/main; then
            echo "$GITHUB_REF_NAME est sur main : plateforme de production"
            platform="$PRODUCTION_PLATFORM_URL"
          elif git rev-parse --verify --quiet origin/staging >/dev/null &&
            git merge-base --is-ancestor HEAD origin/staging; then
            echo "$GITHUB_REF_NAME est sur staging : plateforme de staging"
            platform="$STAGING_PLATFORM_URL"
          else
            echo "$GITHUB_REF_NAME n'est ni sur staging ni sur main : rien à publier depuis là."
            exit 1
          fi
          test -n "$platform" || { echo "la variable de plateforme de cette branche est vide"; exit 1; }
          echo "PUPITRE_PLATFORM_URL=$platform" >> "$GITHUB_ENV"
          echo "platform=$platform" >> "$GITHUB_OUTPUT"

      # The notes of the version are its changelog entry, in every locale the
      # site serves: no entry, no release.
      - name: Check the changelog covers the version
        run: bun scripts/release-notes.ts "$PUPITRE_RELEASE_VERSION" --check

      # The app carries the same version number as the agent: a build that says
      # otherwise would publish artefacts nobody can pair with a release.
      - name: Check the app version against the tag
        run: |
          set -euo pipefail
          declared=$(node -p "require('./apps/desktop/package.json').version")
          test "$declared" = "$PUPITRE_RELEASE_VERSION" || {
            echo "apps/desktop/package.json déclare $declared, le tag dit $PUPITRE_RELEASE_VERSION"
            exit 1
          }

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: apps/agent/go.mod

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install garble
        run: bun --cwd=apps/agent run garble:install

      - name: Build and sign
        working-directory: apps/agent
        run: bun run release
        env:
          PUPITRE_RELEASE_PRIVATE_KEY: ${{ secrets.PUPITRE_RELEASE_PRIVATE_KEY }}

      # A binary that cannot answer hello, or that carries no key, would install
      # itself on a server and never be replaceable again.
      - name: Smoke the built binary
        working-directory: apps/agent
        run: |
          set -euo pipefail
          binary=dist/release/pupitred-linux-amd64
          test "$($binary version)" = "pupitred $PUPITRE_RELEASE_VERSION"
          echo '{"id":1,"cmd":"hello","params":{"app_version":"0.0.0","protocol":1}}' | $binary serve | grep -q '"ok":true'
          grep -qF "$(go run ./tools/release public-key)" "$binary"
        env:
          PUPITRE_RELEASE_PRIVATE_KEY: ${{ secrets.PUPITRE_RELEASE_PRIVATE_KEY }}

      - name: Check the obfuscation
        working-directory: apps/agent
        run: |
          set -euo pipefail
          for binary in dist/release/pupitred-linux-*; do
            readable=$(strings -a "$binary" | grep -c pupitre || true)
            echo "$binary : $readable chaînes lisibles"
            test "$readable" -le 10
          done

      # R2 first: the platform hands out a signed URL as soon as the row exists,
      # so the object has to be there before the version is declared. This
      # bucket is private — the agent is downloaded with a server token, never
      # from a public link.
      - name: Upload to R2
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            bun x wrangler r2 object put \
              "$R2_BUCKET/agent/$PUPITRE_RELEASE_VERSION/pupitred-linux-$arch" \
              --file="apps/agent/dist/release/pupitred-linux-$arch" --remote
          done
          bun x wrangler r2 object put \
            "$R2_BUCKET/agent/$PUPITRE_RELEASE_VERSION/publications.json" \
            --file="apps/agent/dist/release/publications.json" --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Declare the version to the platform
        working-directory: apps/agent
        run: bun run release:publish
        env:
          PUPITRE_PUBLISH_TOKEN: ${{ secrets.PUPITRE_PUBLISH_TOKEN }}

      # What the app build reads: the signed binaries, and the release.json that
      # names their version and their signatures.
      - name: Upload the signed binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-release
          path: |
            apps/agent/dist/release/pupitred-linux-*
            apps/agent/dist/release/release.json
            apps/agent/dist/release/publications.json
          retention-days: 30
          if-no-files-found: error

  desktop:
    name: App ${{ matrix.os }}
    needs: agent
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    env:
      # The channel the built app follows when it looks for its own updates.
      MAIN_VITE_UPDATE_CHANNEL: ${{ needs.agent.outputs.channel }}
      # The bucket the publish job below will write to: the app looks for its
      # updates where its own artefacts were put, not somewhere named twice.
      PUPITRE_DOWNLOADS_URL: ${{ vars.PUPITRE_DOWNLOADS_URL }}
      # The agent the build embeds is the one that was just signed and published,
      # not a fresh compilation of the same sources.
      PUPITRE_AGENT_DIST: ../agent/dist/release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Bun skips that install script often enough that the binary is missing on
      # a fresh checkout, and electron-vite compiles the bytecode with it.
      - name: Install the Electron binary
        run: node node_modules/electron/install.js
        working-directory: apps/desktop

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-release
          path: apps/agent/dist/release

      - name: Prepare the notarization key
        if: runner.os == 'macOS'
        run: |
          umask 077
          printf '%s' "$APPLE_API_KEY_CONTENT" | base64 --decode > "$RUNNER_TEMP/apple-api-key.p8"
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}

      # macOS: Developer ID certificate, then notarization by App Store Connect
      # key. Absent, electron-builder builds unsigned and says so.
      - name: Build and sign for macOS
        if: runner.os == 'macOS'
        run: bun --cwd=apps/desktop run build:mac
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # Windows: Azure Trusted Signing authenticates as an Entra ID application
      # rather than holding a certificate file. The three names of the signing
      # account are repository variables, not secrets; without them the build is
      # unsigned, and SmartScreen will say so to whoever installs it.
      - name: Build and sign for Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${AZURE_ENDPOINT:-}" ]; then
            bun --cwd=apps/desktop run build:win \
              "-c.win.azureSignOptions.endpoint=$AZURE_ENDPOINT" \
              "-c.win.azureSignOptions.codeSigningAccountName=$AZURE_ACCOUNT" \
              "-c.win.azureSignOptions.certificateProfileName=$AZURE_PROFILE"
          else
            echo "Azure Trusted Signing n'est pas configuré : build non signé."
            bun --cwd=apps/desktop run build:win
          fi
        env:
          AZURE_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      # Linux has no signing authority to answer to: the AppImage and the .deb
      # are signed with the release key, like the agent, and the publication
      # records that signature next to the checksum.
      - name: Build for Linux
        if: runner.os == 'Linux'
        run: bun --cwd=apps/desktop run build:linux

      - name: Forget the notarization key
        if: always() && runner.os == 'macOS'
        run: rm -f "$RUNNER_TEMP/apple-api-key.p8"

      - name: Upload the artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest*.yml
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publier l'app
    needs: [agent, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    env:
      PUPITRE_RELEASE_VERSION: ${{ needs.agent.outputs.version }}
      PUPITRE_RELEASE_CHANNEL: ${{ needs.agent.outputs.channel }}
      PUPITRE_PLATFORM_URL: ${{ needs.agent.outputs.platform }}
      PUPITRE_DOWNLOADS_URL: ${{ vars.PUPITRE_DOWNLOADS_URL }}
      R2_BUCKET: ${{ vars.PUPITRE_DOWNLOADS_BUCKET }}
      AGENT_BUCKET: ${{ vars.PUPITRE_R2_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          merge-multiple: true
          path: artefacts

      # The notes of the version are its changelog entry, the same text the
      # marketing site renders: one source, written once, read everywhere.
      - name: Read the release notes
        run: |
          bun scripts/release-notes.ts "$PUPITRE_RELEASE_VERSION" --out="$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      # The bucket first, the platform after: a row that exists is a row whose
      # file is already downloadable.
      - name: Upload to R2 and declare the version
        run: |
          bun --cwd=apps/desktop run release:publish \
            --dir="$GITHUB_WORKSPACE/artefacts" \
            --version="$PUPITRE_RELEASE_VERSION" \
            --channel="$PUPITRE_RELEASE_CHANNEL" \
            --notes-file="$RUNNER_TEMP/notes.md"
        env:
          PUPITRE_RELEASE_PRIVATE_KEY: ${{ secrets.PUPITRE_RELEASE_PRIVATE_KEY }}
          PUPITRE_PUBLISH_TOKEN: ${{ secrets.PUPITRE_PUBLISH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # What `promote.yml` re-declares to production: the same rows, kept with
      # the agent's in the private bucket, never rebuilt.
      - name: Keep the declarations with the artefacts
        run: |
          bun x wrangler r2 object put \
            "$AGENT_BUCKET/app/$PUPITRE_RELEASE_VERSION/publications.json" \
            --file="$GITHUB_WORKSPACE/artefacts/publications.json" --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload the published artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pupitre-${{ needs.agent.outputs.version }}
          path: artefacts
          retention-days: 30
          if-no-files-found: error
