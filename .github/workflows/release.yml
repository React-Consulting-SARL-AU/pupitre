name: Release

# One tag, one version. Every step is a command of `scripts/release`, run the
# same way on a GitHub runner or on a machine of ours: this file only installs
# the tools and names the step. The buckets are the only thing the jobs share.
#
# The tag sits on `staging` — the version goes out in `beta`, declared to the
# platform of that branch — or on `main`, declared to production. `promote.yml`
# carries a version from the first to the second when `main` takes it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version semver à publier, sans le v
        required: true
      channel:
        description: Canal de publication
        type: choice
        options: [beta, stable]
        default: beta

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  PUPITRE_PLATFORM_URL: ${{ vars.PUPITRE_PLATFORM_URL }}
  PUPITRE_STAGING_PLATFORM_URL: ${{ vars.PUPITRE_STAGING_PLATFORM_URL }}
  PUPITRE_DOWNLOADS_URL: ${{ vars.PUPITRE_DOWNLOADS_URL }}
  PUPITRE_DOWNLOADS_BUCKET: ${{ vars.PUPITRE_DOWNLOADS_BUCKET }}
  PUPITRE_R2_BUCKET: ${{ vars.PUPITRE_R2_BUCKET }}

jobs:
  agent:
    name: Agent
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-24.04' }}
    timeout-minutes: 30
    environment: release
    outputs:
      release: ${{ steps.resolve.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: apps/agent/go.mod

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The version, the channel and the platform, from git; the other jobs
      # read them from this job rather than resolving twice.
      - name: Resolve the release
        id: resolve
        run: |
          set -euo pipefail
          args=()
          if [ -n "${VERSION:-}" ]; then args+=("--version=$VERSION"); fi
          if [ -n "${CHANNEL:-}" ]; then args+=("--channel=$CHANNEL"); fi
          bun scripts/release/index.ts resolve "${args[@]}" | tee -a "$GITHUB_ENV"
          echo "release=$(bun scripts/release/index.ts resolve "${args[@]}" --format=json)" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}

      - name: Check the changelog and the app version
        run: bun scripts/release/index.ts check

      # A version the bucket already holds is taken from there, not rebuilt.
      - name: Build, sign and smoke the agent
        run: bun scripts/release/index.ts agent build
        env:
          PUPITRE_RELEASE_PRIVATE_KEY: ${{ secrets.PUPITRE_RELEASE_PRIVATE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Publish the agent
        run: bun scripts/release/index.ts agent publish
        env:
          PUPITRE_PUBLISH_TOKEN: ${{ secrets.PUPITRE_PUBLISH_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

  desktop:
    name: App ${{ matrix.system }}
    needs: agent
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: macOS
            runner: ${{ vars.RUNNER_MACOS || 'macos-15' }}
          - system: Windows
            runner: ${{ vars.RUNNER_WINDOWS || 'windows-2025' }}
          - system: Linux
            runner: ${{ vars.RUNNER_LINUX || 'ubuntu-24.04' }}
    env:
      PUPITRE_RELEASE_VERSION: ${{ fromJSON(needs.agent.outputs.release).version }}
      PUPITRE_RELEASE_CHANNEL: ${{ fromJSON(needs.agent.outputs.release).channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The step reads the agent from the bucket, builds the app of this
      # system, signs it where the system asks for it, and leaves the result
      # in the bucket for the publish job.
      - name: Build the app
        run: bun scripts/release/index.ts desktop
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

  publish:
    name: Publish the app
    needs: [agent, desktop]
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-24.04' }}
    timeout-minutes: 20
    environment: release
    env:
      PUPITRE_RELEASE_VERSION: ${{ fromJSON(needs.agent.outputs.release).version }}
      PUPITRE_RELEASE_CHANNEL: ${{ fromJSON(needs.agent.outputs.release).channel }}
      PUPITRE_PLATFORM_URL: ${{ fromJSON(needs.agent.outputs.release).platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Every installer the three systems left: signed with the release key,
      # put in the public bucket, declared to the platform of the branch.
      - name: Sign, upload and declare
        run: bun scripts/release/index.ts app publish
        env:
          PUPITRE_RELEASE_PRIVATE_KEY: ${{ secrets.PUPITRE_RELEASE_PRIVATE_KEY }}
          PUPITRE_PUBLISH_TOKEN: ${{ secrets.PUPITRE_PUBLISH_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
