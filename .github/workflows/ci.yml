name: CI

# One job, on pull requests only: a feature branch is checked when it asks to
# reach `staging`, and `staging` is checked when it asks to reach `main`. A
# push checks nothing — the minutes are paid, and the same commit would be
# checked twice. Merging into `main` runs nothing either: the merge commit is
# the one the pull request just checked. The end-to-end suites run on the
# owner's machine before a pull request; they are not repeated here.
on:
  pull_request:
    branches: [staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BETTER_AUTH_SECRET: ci-placeholder-better-auth-secret-at-least-32-chars
  VITE_APP_URL: http://localhost:3000
  STRIPE_SECRET_KEY: sk_test_placeholder
  STRIPE_WEBHOOK_SECRET: whsec_placeholder
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  # Cheapest first on one runner: checkout, install and the turbo cache are
  # paid once, and a lint failure surfaces before anything has been built.
  quality:
    name: Quality
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: apps/agent/go.mod

      - name: Restore turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-Quality-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-Quality-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install the Go tools
        run: bun --cwd=apps/agent run tools:install

      - name: Generate Prisma client
        run: bun run db:generate

      # The same files D1 applies, on the SQLite miniflare keeps: a migration
      # that does not apply stops here, before any environment.
      - name: Apply the migrations on an empty local database
        run: bun run db:migrate local

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run check:types

      - name: Test
        run: bun run test

      # electron-builder has nothing to prove here; the desktop workspace still
      # goes through lint, typecheck and test above.
      - name: Build
        run: bun run build -- --filter='!@pupitre/desktop'
