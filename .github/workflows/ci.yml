name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
  BETTER_AUTH_SECRET: ci-placeholder-better-auth-secret-at-least-32-chars
  VITE_APP_URL: http://localhost:3000
  STRIPE_SECRET_KEY: sk_test_placeholder
  STRIPE_WEBHOOK_SECRET: whsec_placeholder
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  # Sequential and cheapest first: one runner shares checkout, install and the
  # turbo cache, and a lint failure surfaces before the build has started.
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WRANGLER_SEND_METRICS: "false"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: apps/agent/go.mod

      - name: Restore turbo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-Quality-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-Quality-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install the Go tools
        run: bun --cwd=apps/agent run tools:install

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Apply migrations on an empty database
        run: bun run db:migrate:deploy
        env:
          MIGRATE_DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run check:types

      # The desktop app and the packages run once, below, with coverage on.
      - name: Test
        run: bun run test -- --filter='!@pupitre/desktop' --filter='!./packages/*'

      - name: Test the desktop app and the packages with coverage
        run: |
          set -euo pipefail
          for workspace in apps/desktop packages/*; do
            bun --cwd="$workspace" run test --coverage --coverage-reporter=lcov --coverage-dir=coverage
          done

      - name: Upload the coverage reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.sha }}
          path: |
            apps/desktop/coverage/lcov.info
            packages/*/coverage/lcov.info
          retention-days: 14
          if-no-files-found: error

      # electron-builder has nothing to prove here; the desktop workspace still
      # goes through lint, typecheck and test above.
      - name: Build
        run: bun run build -- --filter='!@pupitre/desktop'

  console-e2e:
    name: Console end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Non-blocking while the console rendering settles: the report is read, the
    # pull request is not held on it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bun --cwd=apps/web run playwright install --with-deps chromium

      - name: Playwright
        run: bun --cwd=apps/web run test:e2e

      - name: Upload the failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ github.sha }}
          path: .playwright/artifacts
          retention-days: 7
          if-no-files-found: ignore

  desktop-e2e:
    name: Desktop end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Bun skips that install script often enough that the binary is missing
      # on a fresh checkout; running it costs nothing when it is already there.
      - name: Install the Electron binary
        run: node node_modules/electron/install.js
        working-directory: apps/desktop

      - name: Playwright
        run: xvfb-run --auto-servernum bun --cwd=apps/desktop run test:e2e

      - name: Upload the failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-desktop-${{ github.sha }}
          path: .playwright/desktop
          retention-days: 7
          if-no-files-found: ignore

  # The systems the app ships on, without the release chain: the unit tests,
  # the bundle with the agent embedded, and the theme captures where their
  # references live. Only on staging — one runner per system is what it costs.
  desktop-smoke:
    name: Desktop smoke ${{ matrix.os }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: apps/agent/go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install the Electron binary
        run: node node_modules/electron/install.js
        working-directory: apps/desktop

      - name: Test
        run: bun --cwd=apps/desktop run test

      # Through turbo, so the agent is built and embedded before the bundle.
      - name: Build
        run: bun run build -- --filter=@pupitre/desktop

      # The dashboard captures are compared on macOS only, where their
      # references were taken; a runner's fonts may still draw other pixels,
      # so the report is read and the push is not held on it.
      - name: Playwright themes
        id: themes
        if: runner.os == 'macOS'
        continue-on-error: true
        run: bunx playwright test e2e/themes.spec.ts
        working-directory: apps/desktop

      - name: Upload the failure artifacts
        if: failure() || steps.themes.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-smoke-${{ matrix.os }}-${{ github.sha }}
          path: .playwright/desktop
          retention-days: 7
          if-no-files-found: ignore

  gitleaks:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  agent:
    name: Agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: apps/agent/go.mod

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install the Go tools
        run: bun run tools:install

      - name: Lint
        run: bun run lint

      - name: Vulnerabilities
        run: govulncheck ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload the coverage profile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-agent-${{ github.sha }}
          path: apps/agent/coverage.out
          retention-days: 14
          if-no-files-found: error

      - name: Build linux/amd64 and linux/arm64
        run: bun run build

      - name: Upload binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pupitred-${{ github.sha }}
          path: apps/agent/dist/pupitred-linux-*
          retention-days: 14
          if-no-files-found: error

      - name: Install garble
        if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
        run: bun run garble:install

      # A throwaway key proves the release build compiles, obfuscates and stays
      # verifiable without touching the signing secret: real publication is the
      # release-agent workflow's job, gated on the release environment.
      - name: Release build, signing and verification with a throwaway key
        if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
        env:
          PUPITRE_RELEASE_VERSION: 0.0.0-ci
        run: |
          set -euo pipefail
          export PUPITRE_RELEASE_PRIVATE_KEY="$(go run ./tools/release keygen | awk '/^private/{print $2}')"
          bun run release
          for binary in dist/release/pupitred-linux-*; do
            readable=$(strings -a "$binary" | grep -c pupitre || true)
            echo "$binary : $readable chaînes lisibles"
            test "$readable" -le 10
          done
          go test ./internal/release/... ./tools/release/...

      - name: Upload release binaries
        if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pupitred-release-${{ github.sha }}
          path: apps/agent/dist/release/pupitred-linux-*
          retention-days: 14
          if-no-files-found: error
