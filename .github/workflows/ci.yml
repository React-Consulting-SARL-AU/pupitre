name: CI

# A push to `staging` is checked once, on its own SHA. The pull request from
# `staging` to `main` carries that same SHA, so GitHub shows the push's checks
# on it: listing `main` under `pull_request` would run everything a second
# time for nothing. Feature branches reach `staging` by pull request, and that
# is where they are checked.
on:
  pull_request:
    branches: [staging]
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
  BETTER_AUTH_SECRET: ci-placeholder-better-auth-secret-at-least-32-chars
  VITE_APP_URL: http://localhost:3000
  STRIPE_SECRET_KEY: sk_test_placeholder
  STRIPE_WEBHOOK_SECRET: whsec_placeholder
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  # Sequential and cheapest first: one runner shares checkout, install and the
  # turbo cache, and a lint failure surfaces before the build has started.
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WRANGLER_SEND_METRICS: "false"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: apps/agent/go.mod

      - name: Restore turbo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-Quality-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-Quality-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install the Go tools
        run: bun --cwd=apps/agent run tools:install

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Apply migrations on an empty database
        run: bun run db:migrate:deploy
        env:
          MIGRATE_DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run check:types

      # The desktop app and the packages run once, below, with coverage on.
      - name: Test
        run: bun run test -- --filter='!@pupitre/desktop' --filter='!./packages/*'

      - name: Test the desktop app and the packages with coverage
        run: |
          set -euo pipefail
          for workspace in apps/desktop packages/*; do
            bun --cwd="$workspace" run test --coverage --coverage-reporter=lcov --coverage-dir=coverage
          done

      - name: Upload the coverage reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.sha }}
          path: |
            apps/desktop/coverage/lcov.info
            packages/*/coverage/lcov.info
          retention-days: 14
          if-no-files-found: error

      # electron-builder has nothing to prove here; the desktop workspace still
      # goes through lint, typecheck and test above.
      - name: Build
        run: bun run build -- --filter='!@pupitre/desktop'

  console-e2e:
    name: Console end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Non-blocking while the console rendering settles: the report is read, the
    # pull request is not held on it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bun --cwd=apps/web run playwright install --with-deps chromium

      - name: Playwright
        run: bun --cwd=apps/web run test:e2e

      - name: Upload the failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ github.sha }}
          path: .playwright/artifacts
          retention-days: 7
          if-no-files-found: ignore

  desktop-e2e:
    name: Desktop end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Bun skips that install script often enough that the binary is missing
      # on a fresh checkout; running it costs nothing when it is already there.
      - name: Install the Electron binary
        run: node node_modules/electron/install.js
        working-directory: apps/desktop

      - name: Playwright
        run: xvfb-run --auto-servernum bun --cwd=apps/desktop run test:e2e

      - name: Upload the failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-desktop-${{ github.sha }}
          path: .playwright/desktop
          retention-days: 7
          if-no-files-found: ignore

  gitleaks:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # The binary, not the action: the action wants a paid licence from any
      # organisation, the scanner itself is free. Pinned by digest.
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      - name: Scan the history
        run: ./gitleaks git --redact --no-banner --exit-code 2 .

  agent:
    name: Agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: apps/agent/go.mod

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install the Go tools
        run: bun run tools:install

      - name: Lint
        run: bun run lint

      - name: Vulnerabilities
        run: govulncheck ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload the coverage profile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-agent-${{ github.sha }}
          path: apps/agent/coverage.out
          retention-days: 14
          if-no-files-found: error

      - name: Build linux/amd64 and linux/arm64
        run: bun run build

      - name: Upload binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pupitred-${{ github.sha }}
          path: apps/agent/dist/pupitred-linux-*
          retention-days: 14
          if-no-files-found: error
