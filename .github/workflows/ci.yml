name: CI

# One job, run two ways: on a pull request towards `staging` or `main`, and
# called by `release.yml` on the tagged commit before anything is built — the
# release pull request is opened by `GITHUB_TOKEN`, whose own run waits for an
# approval nobody gives and expires at the merge, so it proves nothing. A push
# to `staging` checks nothing: the minutes are paid, the pre-push hook has run
# the same checks, and the release checks the commit that reaches `main`. The
# end-to-end suites run on the owner's machine; they are not repeated here.
on:
  pull_request:
    branches: [staging, main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BETTER_AUTH_SECRET: ci-placeholder-better-auth-secret-at-least-32-chars
  VITE_APP_URL: http://localhost:3000
  STRIPE_SECRET_KEY: sk_test_placeholder
  STRIPE_WEBHOOK_SECRET: whsec_placeholder
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  # Cheapest first on one runner: checkout, install and the turbo cache are
  # paid once, and a lint failure surfaces before anything has been built.
  quality:
    name: Quality
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The binary, not the action: the action wants a paid licence from any
      # organisation. Pinned by digest.
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      # A pull request scans its own commits; a release scans what `main`
      # does not hold yet, which is what it is about to merge.
      - name: Scan the new commits for secrets
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || 'origin/main..HEAD' }}
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner \
            --exit-code 2 --log-opts="$RANGE" .

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: apps/agent/go.mod

      - name: Restore turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-Quality-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-Quality-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install the Go tools
        run: bun --cwd=apps/agent run tools:install

      - name: Generate Prisma client
        run: bun run db:generate

      # The same files D1 applies, on the SQLite miniflare keeps: a migration
      # that does not apply stops here, before any environment.
      - name: Apply the migrations on an empty local database
        run: bun run db:migrate local

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run check:types

      - name: Test
        run: bun run test

      # electron-builder has nothing to prove here; the desktop workspace still
      # goes through lint, typecheck and test above.
      - name: Build
        run: bun run build -- --filter='!@pupitre/desktop'
