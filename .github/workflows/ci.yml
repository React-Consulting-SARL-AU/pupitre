name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
  BETTER_AUTH_SECRET: ci-placeholder-better-auth-secret-at-least-32-chars
  VITE_APP_URL: http://localhost:3000
  STRIPE_SECRET_KEY: sk_test_placeholder
  STRIPE_WEBHOOK_SECRET: whsec_placeholder
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  # Sequential and cheapest first: one runner shares checkout, install and the
  # turbo cache, and a lint failure surfaces before the build has started.
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WRANGLER_SEND_METRICS: "false"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: apps/agent/go.mod

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-Quality-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-Quality-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run check:types

      - name: Test
        run: bun run test

      # electron-builder has nothing to prove here; the desktop workspace still
      # goes through lint, typecheck and test above.
      - name: Build
        run: bun run build -- --filter='!@pupitre/desktop'

  agent:
    name: Agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: apps/agent/go.mod

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Vet
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build linux/amd64 and linux/arm64
        run: bun run build

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: pupitred-${{ github.sha }}
          path: apps/agent/dist/pupitred-linux-*
          retention-days: 14
          if-no-files-found: error

      - name: Install garble
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: go install mvdan.cc/garble@latest

      - name: Release build (garble)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bun run release

      # AGT-15 / PLT-06: Ed25519 signature and R2 upload of dist/release/* go here.

      - name: Upload release binaries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: pupitred-release-${{ github.sha }}
          path: apps/agent/dist/release/pupitred-linux-*
          retention-days: 14
          if-no-files-found: error
