name: Release agent

# The agent alone, without the app: publish again a version the platform has
# lost, or ship one between two versions of the app. A tag goes through
# `release.yml`, which publishes both in one gesture. Same steps, same tool.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version semver à publier, sans le v
        required: true
      channel:
        description: Canal de publication
        type: choice
        options: [beta, stable]
        default: beta

permissions:
  contents: read

# Two releases of the same version at once would race for the same R2 object.
concurrency:
  group: release-agent-${{ github.ref }}
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: "1"
  PUPITRE_PLATFORM_URL: ${{ vars.PUPITRE_PLATFORM_URL }}
  PUPITRE_STAGING_PLATFORM_URL: ${{ vars.PUPITRE_STAGING_PLATFORM_URL }}
  PUPITRE_R2_BUCKET: ${{ vars.PUPITRE_R2_BUCKET }}

jobs:
  release:
    name: Build, sign, publish
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-24.04' }}
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: apps/agent/go.mod

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve the release
        run: bun scripts/release/index.ts resolve "--version=$VERSION" "--channel=$CHANNEL" | tee -a "$GITHUB_ENV"
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}

      - name: Build, sign and smoke the agent
        run: bun scripts/release/index.ts agent build
        env:
          PUPITRE_RELEASE_PRIVATE_KEY: ${{ secrets.PUPITRE_RELEASE_PRIVATE_KEY }}

      - name: Publish the agent
        run: bun scripts/release/index.ts agent publish
        env:
          PUPITRE_PUBLISH_TOKEN: ${{ secrets.PUPITRE_PUBLISH_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
